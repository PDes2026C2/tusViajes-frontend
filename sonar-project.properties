# SonarCloud Configuration
sonar.organization=pdes2026c2
sonar.projectKey=PDes2026C2_tusViajes-frontend
sonar.projectName=tusViajes-frontend
sonar.host.url=https://sonarcloud.io

# Source code and test locations
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Code coverage report from Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions for coverage
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/tests/**,src/main.tsx,src/vite-env.d.ts
