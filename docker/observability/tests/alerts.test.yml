rule_files:
  - ../rules/alerts.yml

evaluation_interval: 15s

tests:
  - name: Una pérdida sostenida de métricas dispara la alerta y la recuperación la resuelve
    interval: 15s
    input_series:
      - series: 'up{job="backend",instance="backend:9091"}'
        values: '0x5 1x4'
      - series: 'up{job="flights-api",instance="flights-api:9092"}'
        values: '1x10'
      - series: 'up{job="otro-servicio",instance="otro:9090"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 45s
        alertname: ApiMetricsUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: ApiMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: backend
              instance: backend:9091
              severity: critical
            exp_annotations:
              summary: No se pueden recolectar métricas de backend
              description: Prometheus no pudo consultar backend:9091 durante al menos un minuto. Revisar la API, su endpoint de métricas y la conectividad.
      - eval_time: 90s
        alertname: ApiMetricsUnavailable
        exp_alerts: []

  - name: Una pérdida de métricas de menos de un minuto no dispara la alerta
    interval: 15s
    input_series:
      - series: 'up{job="flights-api",instance="flights-api:9092"}'
        values: '1 0x2 1x8'
    alert_rule_test:
      - eval_time: 45s
        alertname: ApiMetricsUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: ApiMetricsUnavailable
        exp_alerts: []

  - name: Los errores sostenidos disparan la alerta por API y el tráfico sano la resuelve
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/packages",status="200"}'
        values: '0+90x48'
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/packages",status="500"}'
        values: '0+10x24 240x24'
      - series: 'http_server_requests_seconds_count{job="flights-api",method="GET",uri="/flights",status="200"}'
        values: '0+100x48'
    alert_rule_test:
      - eval_time: 2m
        alertname: ApiHighServerErrorRate
        exp_alerts: []
      - eval_time: 135s
        alertname: ApiHighServerErrorRate
        exp_alerts:
          - exp_labels:
              job: backend
              severity: warning
            exp_annotations:
              summary: Errores 5xx elevados en backend
              description: Más del 5 % de las respuestas son 5xx durante al menos dos minutos, con un mínimo de 20 solicitudes estimadas en la ventana de cinco minutos. Revisar los códigos HTTP y los logs de la API.
      - eval_time: 12m
        alertname: ApiHighServerErrorRate
        exp_alerts: []

  - name: Pocos errores aislados no alcanzan el mínimo de tráfico
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="flights-api",method="GET",uri="/flights",status="500"}'
        values: '0+0.1x48'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighServerErrorRate
        exp_alerts: []

  - name: El límite del cinco por ciento y las respuestas 4xx no disparan la alerta
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/packages",status="200"}'
        values: '0+95x48'
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/packages",status="500"}'
        values: '0+5x48'
      - series: 'http_server_requests_seconds_count{job="flights-api",method="GET",uri="/flights",status="400"}'
        values: '0+100x48'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighServerErrorRate
        exp_alerts: []

  - name: La latencia sostenida dispara la alerta sólo para el endpoint lento y luego se recupera
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/packages",status="200"}'
        values: '0+10x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/packages",status="200",le="0.5"}'
        values: '0x24 10+10x23'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/packages",status="200",le="1"}'
        values: '0x24 10+10x23'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/packages",status="200",le="2"}'
        values: '0+10x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/packages",status="200",le="+Inf"}'
        values: '0+10x48'
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/countries",status="200"}'
        values: '0+1000x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/countries",status="200",le="0.5"}'
        values: '0+1000x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/countries",status="200",le="+Inf"}'
        values: '0+1000x48'
    alert_rule_test:
      - eval_time: 315s
        alertname: ApiHighLatency
        exp_alerts: []
      - eval_time: 6m
        alertname: ApiHighLatency
        exp_alerts:
          - exp_labels:
              job: backend
              method: GET
              uri: /api/packages
              severity: warning
            exp_annotations:
              summary: Latencia elevada en backend
              description: El p95 de GET /api/packages supera un segundo durante al menos cinco minutos, con un mínimo de 20 solicitudes estimadas por ventana de cinco minutos. Revisar el endpoint y sus dependencias.
      - eval_time: 12m
        alertname: ApiHighLatency
        exp_alerts: []

  - name: Pocas solicitudes lentas no alcanzan el mínimo de tráfico por endpoint
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="flights-api",method="GET",uri="/flights",status="200"}'
        values: '0+0.1x48'
      - series: 'http_server_requests_seconds_bucket{job="flights-api",method="GET",uri="/flights",status="200",le="2"}'
        values: '0+0.1x48'
      - series: 'http_server_requests_seconds_bucket{job="flights-api",method="GET",uri="/flights",status="200",le="+Inf"}'
        values: '0+0.1x48'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighLatency
        exp_alerts: []

  - name: Actuator, la ruta de error y otros servicios quedan fuera de las alertas HTTP
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/actuator/health",status="500"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/actuator/health",status="500",le="2"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/actuator/health",status="500",le="+Inf"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_count{job="flights-api",method="GET",uri="/error",status="500"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_bucket{job="flights-api",method="GET",uri="/error",status="500",le="2"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_bucket{job="flights-api",method="GET",uri="/error",status="500",le="+Inf"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_count{job="otro-servicio",method="GET",uri="/api/packages",status="500"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_bucket{job="otro-servicio",method="GET",uri="/api/packages",status="500",le="2"}'
        values: '0+100x48'
      - series: 'http_server_requests_seconds_bucket{job="otro-servicio",method="GET",uri="/api/packages",status="500",le="+Inf"}'
        values: '0+100x48'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiHighServerErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiHighLatency
        exp_alerts: []

  - name: En reposo no se disparan alertas HTTP por divisiones por cero
    interval: 15s
    input_series:
      - series: 'up{job="backend",instance="backend:9091"}'
        values: '1x48'
      - series: 'up{job="flights-api",instance="flights-api:9092"}'
        values: '1x48'
      - series: 'http_server_requests_seconds_count{job="backend",method="GET",uri="/api/packages",status="500"}'
        values: '0x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/packages",status="500",le="2"}'
        values: '0x48'
      - series: 'http_server_requests_seconds_bucket{job="backend",method="GET",uri="/api/packages",status="500",le="+Inf"}'
        values: '0x48'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiMetricsUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiHighServerErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiHighLatency
        exp_alerts: []
