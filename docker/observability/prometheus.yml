global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]

  - job_name: flights-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [flights-api:9092]
